<!DOCTYPE html>

<body>

  <div class="greeting" id="greeting">Olá</div>
  <a class="settings-link" href="definicoes.html" aria-label="Definições">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
  </a>
</header>

<main>
  <div class="balance-card">
    <div class="balance-label">Disponível</div>
    <div class="balance-figure" id="balanceFigure">€0<span class="cents">,00</span></div>
    <div class="balance-extra" id="balanceExtra" style="display:none;"></div>
    <svg class="flow-underline" viewBox="0 0 260 14">
      <defs>
        <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1F6F78"/>
          <stop offset="100%" stop-color="#C97B4A"/>
        </linearGradient>
      </defs>
      <path d="M2 8 Q 20 1, 38 8 T 74 8 T 110 8 T 146 8 T 182 8 T 218 8 T 254 8" fill="none" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-label"><span class="stat-dot" style="background:var(--moss)"></span>Receitas</div>
        <div class="stat-value pos" id="statReceitas">+€0</div>
      </div>
      <div class="stat">
        <div class="stat-label"><span class="stat-dot" style="background:var(--brick)"></span>Despesas</div>
        <div class="stat-value neg" id="statDespesas">−€0</div>
      </div>
    </div>
  </div>

  <div class="section-head">
    <div class="section-title">Contas</div>
    <a class="section-link" href="contas.html">ver tudo →</a>
  </div>
  <div class="conta-list" id="contaListHome">
    <div class="empty-note">A carregar…</div>
  </div>

  <div class="section-head">
    <div class="section-title">Orçamento por categoria</div>
    <a class="section-link" href="orcamento.html">ver tudo →</a>
  </div>
  <div class="budget-card" id="budgetCard">
    <div class="empty-note">A carregar…</div>
  </div>

  <div class="section-head">
    <div class="section-title">Próximos pagamentos</div>
    <a class="section-link" href="calendario.html">calendário →</a>
  </div>
  <div class="pay-list" id="payList">
    <div class="empty-note">A carregar…</div>
  </div>
</main>

<a class="scan-fab" href="digitalizar.html" role="button" aria-label="Digitalizar fatura">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/>
    <circle cx="12" cy="13" r="3.5"/>
  </svg>
</a>

  <a class="tab active" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    Início

    Orçamento
  </a>
  <div class="tab spacer"></div>
  <a class="tab" href="calendario.html">

    Calendário
  </a>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  function euros(v){
    const n = Number(v || 0);
    return n.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function euroParts(v){
    const [inteiro, cent] = euros(v).split(',');
    return { inteiro, cent };
  }

  (async () => {
    const userId = await fluxRequireSession();
    if (!userId) return;

    document.getElementById('dateLine').textContent =
      new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });

    // Nome do perfil
    const { data: perfil } = await flux
      .from('perfis')
      .select('nome')
      .eq('id', userId)
      .single();
    document.getElementById('greeting').textContent = `Olá, ${perfil?.nome || ''}`.trim();

    // Saldo das contas ativas — "Disponível" só conta à ordem/dinheiro (o que dá para gastar já);
    // poupança e investimento aparecem à parte, para não passar a ideia de que esse dinheiro está livre.
    const { data: contas } = await flux
      .from('contas')
      .select('id, nome, tipo, saldo_atual, cor')
      .eq('user_id', userId)
      .eq('ativa', true)
      .order('created_at');
    const TIPOS_DISPONIVEL = ['corrente', 'dinheiro'];
    const saldoDisponivel = (contas || [])
      .filter(c => TIPOS_DISPONIVEL.includes(c.tipo))
      .reduce((s, c) => s + Number(c.saldo_atual), 0);
    const saldoGuardado = (contas || [])
      .filter(c => c.tipo === 'poupanca' || c.tipo === 'investimento')
      .reduce((s, c) => s + Number(c.saldo_atual), 0);
    const { inteiro, cent } = euroParts(saldoDisponivel);
    document.getElementById('balanceFigure').innerHTML = `€${inteiro}<span class="cents">,${cent}</span>`;
    if (saldoGuardado !== 0) {
      const balanceExtra = document.getElementById('balanceExtra');
      balanceExtra.textContent = `+ €${euros(saldoGuardado)} em poupança e investimentos`;
      balanceExtra.style.display = '';
    }

    const nomesTipo = { corrente: 'Conta à ordem', poupanca: 'Poupança', investimento: 'Investimento', dinheiro: 'Dinheiro', cartao_credito: 'Cartão de crédito' };
    const iniciaisTipo = { corrente: 'CO', poupanca: 'PO', investimento: 'IN', dinheiro: 'DI', cartao_credito: 'CC' };
    const contaListHome = document.getElementById('contaListHome');
    if (!contas || contas.length === 0) {
      contaListHome.innerHTML = '<div class="empty-note">Ainda sem contas.</div>';
    } else {
      contaListHome.innerHTML = contas.map(c => {
        const cor = c.cor || '#4E6167';
        const negativo = Number(c.saldo_atual) < 0;
        return `
          <a class="conta-card" href="conta-detalhe.html?id=${c.id}">
            <div class="conta-icon" style="background:${cor}">${iniciaisTipo[c.tipo] || '?'}</div>
            <div class="conta-info">
              <div class="conta-nome">${c.nome}</div>
              <div class="conta-tipo">${nomesTipo[c.tipo] || c.tipo}</div>
            </div>
            <div class="conta-saldo ${negativo ? 'neg' : ''}">€${euros(c.saldo_atual)}</div>
          </a>`;
      }).join('');
    }

    // Receitas/despesas do mês corrente
    const agora = new Date();
    const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString().slice(0, 10);
    const fimMes = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).toISOString().slice(0, 10);

    const [{ data: receitasMes }, { data: despesasMes }] = await Promise.all([
      flux.from('receitas').select('valor').eq('user_id', userId).gte('data', inicioMes).lte('data', fimMes),
      flux.from('despesas').select('valor').eq('user_id', userId).gte('data', inicioMes).lte('data', fimMes)
    ]);
    const totalReceitas = (receitasMes || []).reduce((s, r) => s + Number(r.valor), 0);
    const totalDespesas = (despesasMes || []).reduce((s, d) => s + Number(d.valor), 0);
    document.getElementById('statReceitas').textContent = `+€${euros(totalReceitas)}`;
    document.getElementById('statDespesas').textContent = `−€${euros(totalDespesas)}`;

    // Orçamento por categoria (categorias ativas + despesas do mês)
    const { data: categorias } = await flux
      .from('orcamento_categorias')
      .select('id, nome, limite_mensal')
      .eq('user_id', userId)
      .eq('ativa', true)
      .order('nome');

    const budgetCard = document.getElementById('budgetCard');
    if (!categorias || categorias.length === 0) {
      budgetCard.innerHTML = '<div class="empty-note">Ainda sem categorias.</div>';
    } else {
      const gastosPorCategoria = {};
      const { data: despesasComCategoria } = await flux
        .from('despesas')
        .select('valor, categoria_id')
        .eq('user_id', userId)
        .gte('data', inicioMes)
        .lte('data', fimMes);
      (despesasComCategoria || []).forEach(d => {
        gastosPorCategoria[d.categoria_id] = (gastosPorCategoria[d.categoria_id] || 0) + Number(d.valor);
      });

      // Esconde categorias sem limite definido e sem despesas este mês — não dizem nada.
      // Uma categoria sem limite mas COM despesa continua a aparecer (precisas de a ver).
      const categoriasComInfo = categorias.filter(cat => {
        const gasto = gastosPorCategoria[cat.id] || 0;
        const limite = Number(cat.limite_mensal);
        return limite > 0 || gasto > 0;
      });

      if (categoriasComInfo.length === 0) {
        budgetCard.innerHTML = '<div class="empty-note">Sem categorias com limite ou despesas este mês.</div>';
      } else {
        budgetCard.innerHTML = categoriasComInfo.map(cat => {
          const gasto = gastosPorCategoria[cat.id] || 0;
          const limite = Number(cat.limite_mensal);
          const pct = limite > 0 ? Math.min(100, Math.round((gasto / limite) * 100)) : 0;
          const corClasse = gasto > limite ? 'brick' : (pct >= 80 ? 'copper' : '');
          return `
            <div class="budget-row">
              <div class="budget-top">
                <span class="budget-cat">${cat.nome}</span>
                <span class="budget-amounts">€${euros(gasto)} / €${euros(limite)}</span>
              </div>
              <div class="budget-bar-track"><div class="budget-bar-fill ${corClasse}" style="width:${pct}%"></div></div>
            </div>`;
        }).join('');
      }
    }

    // Próximos pagamentos (pendentes/atrasados, mais próximos primeiro)
    const { data: pagamentos } = await flux
      .from('pagamentos_agenda')
      .select('titulo, valor, data_vencimento, estado')
      .eq('user_id', userId)
      .in('estado', ['pendente', 'atrasado'])
      .order('data_vencimento', { ascending: true })
      .limit(5);

    const payList = document.getElementById('payList');
    if (!pagamentos || pagamentos.length === 0) {
      payList.innerHTML = '<div class="empty-note">Sem pagamentos pendentes.</div>';
    } else {
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      payList.innerHTML = pagamentos.map(p => {
        const venc = new Date(p.data_vencimento + 'T00:00:00');
        const dias = Math.round((venc - hoje) / 86400000);
        let badgeClasse, badgeTexto;
        if (p.estado === 'atrasado' || dias < 0) {
          badgeClasse = 'overdue'; badgeTexto = 'ATRASADO';
        } else if (dias <= 3) {
          badgeClasse = 'soon'; badgeTexto = `<span class="num">${dias}</span>dias`;
        } else {
          badgeClasse = 'later'; badgeTexto = `<span class="num">${dias}</span>dias`;
        }
        const dataFmt = venc.toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' });
        return `
          <div class="pay-card">
            <div class="pay-badge ${badgeClasse}">${badgeTexto}</div>
            <div class="pay-info">
              <div class="pay-title">${p.titulo}</div>
              <div class="pay-sub">${dataFmt}</div>
            </div>
            <div class="pay-amount">€${euros(p.valor)}</div>
          </div>`;
      }).join('');
    }
  })();
</script>

</body>
</html>
