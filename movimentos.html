<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux — Movimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6F78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flux">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
</head>
<body>

<header>
  <div class="eyebrow">FLUX</div>
  <div class="greeting">Movimentos</div>
</header>

<main>
  <div class="filter-bar">
    <div class="month-nav">
      <button id="mesAnterior" aria-label="Mês anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="month-label" id="mesLabel">—</div>
      <button id="mesSeguinte" aria-label="Mês seguinte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="filter-row">
      <select class="filter-select" id="filtroConta"><option value="">Todas as contas</option></select>
      <select class="filter-select" id="filtroCategoria"><option value="">Todas as categorias</option></select>
    </div>
    <input class="search-input" id="filtroTexto" type="text" placeholder="Procurar por descrição…">
  </div>

  <div class="section-head" style="margin-top:0;">
    <div></div>
    <a class="section-link" href="recorrencias.html">recorrências →</a>
  </div>

  <button class="toggle-add-btn" id="toggleAddBtn">+ Novo movimento</button>

  <div class="add-form" id="movForm" style="display:none;">
    <div class="segmented" id="tipoSegmented">
      <button type="button" class="active" data-tipo="despesa">Despesa</button>
      <button type="button" data-tipo="receita">Receita</button>
      <button type="button" data-tipo="transferencia">Transferência</button>
    </div>
    <div class="field">
      <label>Descrição<span id="fDescricaoOpcional" style="display:none;"> (opcional)</span></label>
      <input type="text" id="fDescricao" placeholder="Ex: Supermercado">
    </div>
    <div class="field">
      <label>Valor (€)</label>
      <input type="text" inputmode="decimal" id="fValor" placeholder="0,00">
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="fData">
    </div>
    <div class="field">
      <label id="fContaLabel">Conta</label>
      <select id="fConta"></select>
    </div>
    <div class="field" id="fContaDestinoWrap" style="display:none;">
      <label>Para a conta</label>
      <select id="fContaDestino"></select>
    </div>
    <div class="field" id="fCategoriaWrap">
      <label>Categoria</label>
      <select id="fCategoria"></select>
    </div>
    <div class="field" id="fSubcategoriaWrap">
      <label>Subcategoria (opcional)</label>
      <select id="fSubcategoria"><option value="">— nenhuma —</option></select>
    </div>
    <div class="field">
      <label>Notas (opcional)</label>
      <input type="text" id="fNotas">
    </div>
    <div class="field" id="fRepetirWrap">
      <label class="checkbox-field"><input type="checkbox" id="fRepetir"> 🔁 Repetir automaticamente</label>
    </div>
    <div id="fRecorrenciaFields" style="display:none;">
      <div class="field">
        <label>Frequência</label>
        <select id="fFrequencia">
          <option value="diaria">Diária</option>
          <option value="semanal">Semanal</option>
          <option value="quinzenal">Quinzenal</option>
          <option value="mensal">Mensal</option>
          <option value="anual">Anual</option>
        </select>
      </div>
      <div class="field" id="fDiaSemanaWrap" style="display:none;">
        <label>Dia da semana</label>
        <select id="fDiaSemana">
          <option value="0">Domingo</option>
          <option value="1">Segunda</option>
          <option value="2">Terça</option>
          <option value="3">Quarta</option>
          <option value="4">Quinta</option>
          <option value="5">Sexta</option>
          <option value="6">Sábado</option>
        </select>
      </div>
      <div class="field" id="fDiaMesWrap" style="display:none;">
        <label>Dia do mês</label>
        <input type="number" min="1" max="31" id="fDiaMes" value="1">
      </div>
      <div class="field" id="fMesRefWrap" style="display:none;">
        <label>Mês</label>
        <select id="fMesRef">
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
      </div>
      <div class="field">
        <label>Até (opcional)</label>
        <input type="date" id="fDataFim">
      </div>
      <div class="field" id="fCriaPagamentoWrap" style="display:none;">
        <label class="checkbox-field"><input type="checkbox" id="fCriaPagamento"> Criar como lembrete a confirmar (em vez de despesa automática)</label>
      </div>
      <div class="empty-note">A primeira ocorrência é criada automaticamente todos os dias às 5h — a data acima marca só a partir de quando começa.</div>
    </div>
    <div class="add-form-actions">
      <button class="btn-secondary" id="cancelarMovBtn">Cancelar</button>
      <button class="btn-small-primary" id="guardarMovBtn">Guardar</button>
    </div>
  </div>

  <div id="movContainer">
    <p class="empty-note">A carregar…</p>
  </div>
</main>

<nav class="tabbar">
  <a class="tab" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    Início
  </a>
  <a class="tab" href="orcamento.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9M3 12h9V3"/></svg>
    Orçamento
  </a>
  <div class="tab spacer"></div>
  <a class="tab" href="calendario.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Calendário
  </a>
  <a class="tab active" href="movimentos.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
    Movimentos
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  function euros(v){
    const n = Number(v || 0);
    return n.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function euroInput(v){
    return String(v).replace(',', '.').trim();
  }

  let userIdGlobal = null;
  let anoAtual, mesAtual; // mesAtual: 1-12
  let contasGlobal = [];
  let despesaCategoriasGlobal = [];
  let receitaCategoriasGlobal = [];
  let subcategoriasGlobal = [];
  let movimentosGlobal = [];
  let tipoFormAtual = 'despesa';
  let editandoId = null;

  const mesesNomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function mesStr(){ return `${anoAtual}-${String(mesAtual).padStart(2,'0')}`; }
  function inicioMes(){ return `${mesStr()}-01`; }
  function fimMes(){ const d = new Date(anoAtual, mesAtual, 0); return d.toISOString().slice(0,10); }

  async function carregarBaseDados(){
    const [{ data: contas }, { data: catsDespesa }, { data: catsReceita }, { data: subcats }] = await Promise.all([
      flux.from('contas').select('id, nome, tipo').eq('user_id', userIdGlobal).eq('ativa', true).order('nome'),
      flux.from('orcamento_categorias').select('id, nome, cor').eq('user_id', userIdGlobal).eq('ativa', true).order('nome'),
      flux.from('receitas_categorias').select('id, nome, cor').eq('user_id', userIdGlobal).eq('ativa', true).order('nome'),
      flux.from('orcamento_subcategorias').select('id, nome, categoria_id').eq('user_id', userIdGlobal).eq('ativa', true).order('nome')
    ]);
    contasGlobal = contas || [];
    despesaCategoriasGlobal = catsDespesa || [];
    receitaCategoriasGlobal = catsReceita || [];
    subcategoriasGlobal = subcats || [];

    const fConta = document.getElementById('fConta');
    const fContaDestino = document.getElementById('fContaDestino');
    const filtroConta = document.getElementById('filtroConta');
    fConta.innerHTML = contasGlobal.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    fContaDestino.innerHTML = contasGlobal.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    filtroConta.innerHTML = '<option value="">Todas as contas</option>' + contasGlobal.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

    atualizarSelectCategoriaForm();
    atualizarFiltroCategoria();
  }

  function atualizarSelectCategoriaForm(){
    const ehTransferencia = tipoFormAtual === 'transferencia';
    document.getElementById('fContaLabel').textContent = ehTransferencia ? 'De (conta de origem)' : 'Conta';
    document.getElementById('fContaDestinoWrap').style.display = ehTransferencia ? '' : 'none';
    document.getElementById('fCategoriaWrap').style.display = ehTransferencia ? 'none' : '';
    document.getElementById('fDescricaoOpcional').style.display = ehTransferencia ? '' : 'none';

    if (!ehTransferencia) {
      const fCategoria = document.getElementById('fCategoria');
      const lista = tipoFormAtual === 'despesa' ? despesaCategoriasGlobal : receitaCategoriasGlobal;
      fCategoria.innerHTML = lista.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    }
    document.getElementById('fSubcategoriaWrap').style.display = tipoFormAtual === 'despesa' ? '' : 'none';
    atualizarSelectSubcategoria();
    atualizarCamposRecorrencia();
  }

  function atualizarSelectSubcategoria(){
    const fSub = document.getElementById('fSubcategoria');
    const catId = document.getElementById('fCategoria').value;
    const opcoes = subcategoriasGlobal.filter(s => s.categoria_id === catId);
    fSub.innerHTML = '<option value="">— nenhuma —</option>' + opcoes.map(s => `<option value="${s.id}">${s.nome}</option>`).join('');
  }

  function atualizarFiltroCategoria(){
    const filtroCategoria = document.getElementById('filtroCategoria');
    const todas = [...despesaCategoriasGlobal.map(c => ({...c, tipo:'despesa'})), ...receitaCategoriasGlobal.map(c => ({...c, tipo:'receita'}))];
    filtroCategoria.innerHTML = '<option value="">Todas as categorias</option>' + todas.map(c => `<option value="${c.tipo}:${c.id}">${c.nome}</option>`).join('');
  }

  async function carregarMovimentos(){
    document.getElementById('mesLabel').textContent = `${mesesNomes[mesAtual-1]} ${anoAtual}`;
    document.getElementById('movContainer').innerHTML = '<p class="empty-note">A carregar…</p>';

    const { data, error } = await flux
      .from('vw_movimentos')
      .select('*')
      .eq('user_id', userIdGlobal)
      .gte('data', inicioMes())
      .lte('data', fimMes())
      .order('data', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('movContainer').innerHTML = '<p class="empty-note">Erro a carregar movimentos.</p>';
      return;
    }
    movimentosGlobal = data || [];
    renderMovimentos();
  }

  function nomeConta(id){ return contasGlobal.find(c => c.id === id)?.nome || '—'; }
  function categoriaInfo(tipo, id){
    const lista = tipo === 'despesa' ? despesaCategoriasGlobal : receitaCategoriasGlobal;
    return lista.find(c => c.id === id);
  }
  function nomeSubcategoria(id){ return subcategoriasGlobal.find(s => s.id === id)?.nome; }

  function renderMovimentos(){
    const filtroConta = document.getElementById('filtroConta').value;
    const filtroCategoria = document.getElementById('filtroCategoria').value;
    const filtroTexto = document.getElementById('filtroTexto').value.trim().toLowerCase();

    let lista = movimentosGlobal.filter(m => {
      if (filtroConta && m.conta_id !== filtroConta) return false;
      if (filtroCategoria) {
        const [tipo, id] = filtroCategoria.split(':');
        if (m.tipo !== tipo || m.categoria_id !== id) return false;
      }
      if (filtroTexto && !(m.descricao || '').toLowerCase().includes(filtroTexto)) return false;
      return true;
    });

    const container = document.getElementById('movContainer');
    if (lista.length === 0) {
      container.innerHTML = '<p class="empty-note">Sem movimentos neste mês.</p>';
      return;
    }

    // Agrupar por dia
    const grupos = {};
    lista.forEach(m => { (grupos[m.data] = grupos[m.data] || []).push(m); });
    const dias = Object.keys(grupos).sort((a,b) => b.localeCompare(a));

    container.innerHTML = dias.map(dia => {
      const dataFmt = new Date(dia + 'T00:00:00').toLocaleDateString('pt-PT', { weekday:'short', day:'numeric', month:'short' });
      const linhas = grupos[dia].map(m => {
        const sinal = Number(m.valor_sinal) >= 0 ? '+' : '−';
        const classe = Number(m.valor_sinal) >= 0 ? 'pos' : 'neg';
        let corDot, partes;
        if (m.tipo === 'transferencia') {
          corDot = '#4E6167';
          const destinoOuOrigem = Number(m.valor_sinal) < 0 ? 'para' : 'de';
          partes = [`Transferência ${destinoOuOrigem} ${nomeConta(m.conta_contraparte_id)}`];
        } else {
          const cat = categoriaInfo(m.tipo, m.categoria_id);
          const subNome = m.subcategoria_id ? nomeSubcategoria(m.subcategoria_id) : null;
          corDot = cat?.cor || '#8A9A9C';
          partes = [cat?.nome || 'Sem categoria', nomeConta(m.conta_id)];
          if (subNome) partes.splice(1, 0, subNome);
        }
        return `
          <div class="mov-row" data-id="${m.id}" data-tipo="${m.tipo}">
            <span class="mov-dot" style="background:${corDot}"></span>
            <div class="mov-info">
              <div class="mov-desc">${m.descricao}</div>
              <div class="mov-sub">${partes.join(' · ')}</div>
            </div>
            <div class="mov-amount ${classe}">${sinal}€${euros(m.valor)}</div>
          </div>`;
      }).join('');
      return `<div class="mov-day-label">${dataFmt}</div><div class="mov-list">${linhas}</div>`;
    }).join('');

    container.querySelectorAll('.mov-row').forEach(row => {
      row.addEventListener('click', () => { abrirEdicao(row.dataset.id, row.dataset.tipo); });
    });
  }

  function abrirFormulario(){
    document.getElementById('movForm').style.display = '';
    document.getElementById('toggleAddBtn').style.display = 'none';
  }
  function fecharFormulario(){
    document.getElementById('movForm').style.display = 'none';
    document.getElementById('toggleAddBtn').style.display = '';
    editandoId = null;
    document.getElementById('fDescricao').value = '';
    document.getElementById('fValor').value = '';
    document.getElementById('fNotas').value = '';
    document.getElementById('fRepetir').checked = false;
    document.getElementById('fRecorrenciaFields').style.display = 'none';
    document.getElementById('fDataFim').value = '';
    document.getElementById('fCriaPagamento').checked = false;
    document.getElementById('guardarMovBtn').textContent = 'Guardar';
    const apagarBtn = document.getElementById('apagarMovBtn');
    if (apagarBtn) apagarBtn.style.display = 'none';
  }

  function atualizarCamposRecorrencia(){
    const freq = document.getElementById('fFrequencia').value;
    document.getElementById('fDiaSemanaWrap').style.display = (freq === 'semanal' || freq === 'quinzenal') ? '' : 'none';
    document.getElementById('fDiaMesWrap').style.display = (freq === 'mensal' || freq === 'anual') ? '' : 'none';
    document.getElementById('fMesRefWrap').style.display = (freq === 'anual') ? '' : 'none';
    document.getElementById('fCriaPagamentoWrap').style.display = (tipoFormAtual === 'despesa') ? '' : 'none';
  }

  function abrirNovo(){
    fecharFormulario();
    tipoFormAtual = 'despesa';
    document.querySelectorAll('#tipoSegmented button').forEach(b => b.classList.toggle('active', b.dataset.tipo === 'despesa'));
    atualizarSelectCategoriaForm();
    document.getElementById('fData').value = new Date().toISOString().slice(0,10);
    if (contasGlobal[0]) document.getElementById('fConta').value = contasGlobal[0].id;
    document.getElementById('fRepetirWrap').style.display = '';
    abrirFormulario();
  }

  async function abrirEdicao(id, tipo){
    let dadosTransferencia = null;
    if (tipo === 'transferencia') {
      // uma transferência aparece 2x em vw_movimentos (um lado por conta) — vamos buscar o registo completo
      const { data } = await flux.from('transferencias').select('*').eq('id', id).single();
      if (!data) return;
      dadosTransferencia = data;
    } else {
      const m = movimentosGlobal.find(x => x.id === id && x.tipo === tipo);
      if (!m) return;
      dadosTransferencia = m;
    }
    const m = dadosTransferencia;

    editandoId = id;
    tipoFormAtual = tipo;
    document.querySelectorAll('#tipoSegmented button').forEach(b => b.classList.toggle('active', b.dataset.tipo === tipo));
    atualizarSelectCategoriaForm();
    document.getElementById('fDescricao').value = m.descricao;
    document.getElementById('fValor').value = String(m.valor).replace('.', ',');
    document.getElementById('fData').value = m.data;
    document.getElementById('fNotas').value = m.notas || '';

    if (tipo === 'transferencia') {
      document.getElementById('fConta').value = m.conta_origem_id;
      document.getElementById('fContaDestino').value = m.conta_destino_id;
    } else {
      document.getElementById('fConta').value = m.conta_id;
      document.getElementById('fCategoria').value = m.categoria_id;
      atualizarSelectSubcategoria();
      if (m.subcategoria_id) document.getElementById('fSubcategoria').value = m.subcategoria_id;
    }

    document.getElementById('fRepetirWrap').style.display = 'none';
    document.getElementById('guardarMovBtn').textContent = 'Guardar alterações';
    abrirFormulario();

    if (!document.getElementById('apagarMovBtn')) {
      const btn = document.createElement('button');
      btn.id = 'apagarMovBtn';
      btn.className = 'icon-btn danger';
      btn.style.marginLeft = '8px';
      btn.title = 'Apagar';
      btn.type = 'button';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/></svg>';
      document.querySelector('.add-form-actions').appendChild(btn);
      btn.addEventListener('click', apagarMovimento);
    }
    document.getElementById('apagarMovBtn').style.display = '';
  }

  function tabelaDoTipo(tipo){
    if (tipo === 'despesa') return 'despesas';
    if (tipo === 'receita') return 'receitas';
    return 'transferencias';
  }

  async function apagarMovimento(){
    if (!editandoId) return;
    if (!confirm('Apagar este movimento?')) return;
    const { error } = await flux.from(tabelaDoTipo(tipoFormAtual)).delete().eq('id', editandoId);
    if (error) { alert('Erro ao apagar.'); return; }
    fecharFormulario();
    carregarMovimentos();
  }

  async function guardarMovimento(){
    const descricao = document.getElementById('fDescricao').value.trim();
    const valorTxt = euroInput(document.getElementById('fValor').value);
    const valor = parseFloat(valorTxt);
    const data = document.getElementById('fData').value;
    const notas = document.getElementById('fNotas').value.trim() || null;

    if (!valor || valor <= 0 || !data) {
      alert('Preenche valor e data.');
      return;
    }

    const repetir = !editandoId && document.getElementById('fRepetir').checked;

    let payload;
    if (tipoFormAtual === 'transferencia') {
      const conta_origem_id = document.getElementById('fConta').value;
      const conta_destino_id = document.getElementById('fContaDestino').value;
      if (!conta_origem_id || !conta_destino_id) { alert('Escolhe a conta de origem e a conta de destino.'); return; }
      if (conta_origem_id === conta_destino_id) { alert('A conta de origem e a de destino têm de ser diferentes.'); return; }
      payload = {
        user_id: userIdGlobal, descricao: descricao || 'Transferência', valor, data,
        conta_origem_id, conta_destino_id, notas
      };
    } else {
      const conta_id = document.getElementById('fConta').value;
      const categoria_id = document.getElementById('fCategoria').value;
      const subcategoria_id = document.getElementById('fSubcategoria').value || null;
      if (!descricao || !conta_id || !categoria_id) {
        alert('Preenche descrição, conta e categoria.');
        return;
      }
      payload = { user_id: userIdGlobal, descricao, valor, data, conta_id, categoria_id, notas };
      if (tipoFormAtual === 'despesa') payload.subcategoria_id = subcategoria_id;
    }

    if (repetir) {
      const freq = document.getElementById('fFrequencia').value;
      const dia_semana = (freq === 'semanal' || freq === 'quinzenal') ? Number(document.getElementById('fDiaSemana').value) : null;
      const dia_mes = (freq === 'mensal' || freq === 'anual') ? Number(document.getElementById('fDiaMes').value) : null;
      const mes_referencia = (freq === 'anual') ? Number(document.getElementById('fMesRef').value) : null;
      if ((freq === 'mensal' || freq === 'anual') && (!dia_mes || dia_mes < 1 || dia_mes > 31)) {
        alert('Indica um dia do mês válido (1-31).');
        return;
      }
      const data_fim = document.getElementById('fDataFim').value || null;

      let recPayload = {
        user_id: userIdGlobal, descricao: payload.descricao, valor, frequencia: freq,
        dia_semana, dia_mes, mes_referencia, data_inicio: data, data_fim, ativo: true
      };
      if (tipoFormAtual === 'transferencia') {
        recPayload.conta_origem_id = payload.conta_origem_id;
        recPayload.conta_destino_id = payload.conta_destino_id;
        recPayload.notas = notas;
      } else {
        recPayload.conta_id = payload.conta_id;
        recPayload.categoria_id = payload.categoria_id;
        if (tipoFormAtual === 'despesa') {
          recPayload.subcategoria_id = payload.subcategoria_id;
          recPayload.cria_pagamento_agenda = document.getElementById('fCriaPagamento').checked;
        }
      }

      const tabelaRec = tabelaDoTipo(tipoFormAtual) + '_recorrentes';
      const { error: erroRec } = await flux.from(tabelaRec).insert(recPayload);
      if (erroRec) { alert('Erro ao criar recorrência: ' + erroRec.message); return; }
      fecharFormulario();
      alert('Recorrência criada. A primeira ocorrência nasce automaticamente na data marcada.');
      return;
    }

    const tabela = tabelaDoTipo(tipoFormAtual);
    let error;
    if (editandoId) {
      ({ error } = await flux.from(tabela).update(payload).eq('id', editandoId));
    } else {
      ({ error } = await flux.from(tabela).insert(payload));
    }
    if (error) { alert('Erro ao guardar: ' + error.message); return; }
    fecharFormulario();
    carregarMovimentos();
  }

  (async () => {
    userIdGlobal = await fluxRequireSession();
    if (!userIdGlobal) return;

    const hoje = new Date();
    anoAtual = hoje.getFullYear();
    mesAtual = hoje.getMonth() + 1;

    await carregarBaseDados();

    const contaParam = new URLSearchParams(window.location.search).get('conta');
    if (contaParam) document.getElementById('filtroConta').value = contaParam;

    await carregarMovimentos();

    document.getElementById('mesAnterior').addEventListener('click', () => {
      mesAtual--; if (mesAtual < 1) { mesAtual = 12; anoAtual--; }
      carregarMovimentos();
    });
    document.getElementById('mesSeguinte').addEventListener('click', () => {
      mesAtual++; if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
      carregarMovimentos();
    });

    document.getElementById('filtroConta').addEventListener('change', renderMovimentos);
    document.getElementById('filtroCategoria').addEventListener('change', renderMovimentos);
    document.getElementById('filtroTexto').addEventListener('input', renderMovimentos);

    document.getElementById('toggleAddBtn').addEventListener('click', abrirNovo);
    document.getElementById('cancelarMovBtn').addEventListener('click', fecharFormulario);
    document.getElementById('guardarMovBtn').addEventListener('click', guardarMovimento);
    document.getElementById('fCategoria').addEventListener('change', atualizarSelectSubcategoria);
    document.getElementById('fRepetir').addEventListener('change', () => {
      document.getElementById('fRecorrenciaFields').style.display = document.getElementById('fRepetir').checked ? '' : 'none';
    });
    document.getElementById('fFrequencia').addEventListener('change', atualizarCamposRecorrencia);

    document.querySelectorAll('#tipoSegmented button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (editandoId) return; // não troca tipo a meio de uma edição
        document.querySelectorAll('#tipoSegmented button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tipoFormAtual = btn.dataset.tipo;
        atualizarSelectCategoriaForm();
      });
    });
  })();
</script>

</body>
</html>
