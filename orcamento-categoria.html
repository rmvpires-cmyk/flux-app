<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux — Categoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="back-link" id="backLink" href="orcamento.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    orçamento
  </a>
  <div class="eyebrow" id="mesLabel" style="margin-top:10px"></div>
  <div style="display:flex; align-items:center; justify-content:space-between; margin-top:2px">
    <div class="greeting" id="categoriaNome">…</div>
    <div class="row-actions">
      <button class="icon-btn" id="editCatBtn" aria-label="Editar categoria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="icon-btn danger" id="archiveCatBtn" aria-label="Arquivar categoria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>
      </button>
    </div>
  </div>
  <div class="inline-edit-row" id="editCatRow">
    <input type="text" id="editCatNome" placeholder="Nome da categoria">
    <button type="button" class="btn-small-primary" id="guardarCatNome" style="flex:0 0 auto; padding:9px 14px;">Guardar</button>
  </div>
</header>

<main>
  <div class="limit-card">
    <div class="limit-top">
      <div>
        <div class="limit-label">Gasto neste mês</div>
        <div class="limit-amounts" id="limitAmounts">€0,00 / €0,00</div>
      </div>
      <button class="limit-edit-btn" id="editBtn">editar limite deste mês</button>
    </div>
    <div class="limit-edit-form" id="editForm">
      <input type="number" step="0.01" min="0" id="novoLimite" inputmode="decimal">
      <button type="button" id="guardarLimite">Guardar</button>
      <button type="button" class="cancel" id="cancelarEdicao">Cancelar</button>
    </div>
    <div class="empty-note" id="notaLimiteOmissao" style="padding-top:12px"></div>
  </div>

  <div class="section-head">
    <div class="section-title">Subcategorias</div>
  </div>
  <div class="subcat-list" id="subcatList">
    <div class="empty-note">A carregar…</div>
  </div>
  <button class="toggle-add-btn" id="toggleAddSubBtn">+ Nova subcategoria</button>
  <div class="inline-edit-row" id="addSubRow">
    <input type="text" id="novaSubNome" placeholder="Nome da subcategoria">
    <button type="button" class="btn-small-primary" id="guardarNovaSub" style="flex:0 0 auto; padding:9px 14px;">Criar</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  function euros(v){
    const n = Number(v || 0);
    return n.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  const params = new URLSearchParams(window.location.search);
  const categoriaId = params.get('id');
  let mesAtual = params.get('mes');
  if (!mesAtual || !/^\d{4}-\d{2}$/.test(mesAtual)) {
    const hoje = new Date();
    mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
  }
  const anoDoMes = mesAtual.slice(0, 4);
  document.getElementById('backLink').href = `orcamento.html?ano=${anoDoMes}`;

  function labelDoMes(mesStr) {
    const [ano, mes] = mesStr.split('-').map(Number);
    const d = new Date(ano, mes - 1, 1);
    return d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
  }
  document.getElementById('mesLabel').textContent = labelDoMes(mesAtual);

  let categoriaAtual = null;
  let userIdGlobal = null;
  let limiteMesAtual = 0;

  function limiteEfetivo(limiteOmissao, excecoesOrdenadas, mesStr) {
    const alvo = `${mesStr}-01`;
    let valor = limiteOmissao;
    for (const exc of excecoesOrdenadas) {
      if (exc.mes <= alvo) valor = Number(exc.limite_mensal);
      else break;
    }
    return valor;
  }

  async function carregarTudo() {
    const userId = userIdGlobal;
    const [ano, mesNum] = mesAtual.split('-').map(Number);
    const inicio = new Date(ano, mesNum - 1, 1).toISOString().slice(0, 10);
    const fim = new Date(ano, mesNum, 0).toISOString().slice(0, 10);

    const [{ data: categoria }, { data: excecoes }, { data: subcategorias }, { data: despesas }] = await Promise.all([
      flux.from('orcamento_categorias').select('id, nome, limite_mensal, cor').eq('id', categoriaId).eq('user_id', userId).single(),
      flux.from('orcamento_categoria_limites').select('mes, limite_mensal').eq('categoria_id', categoriaId).eq('user_id', userId).order('mes'),
      flux.from('orcamento_subcategorias').select('id, nome').eq('categoria_id', categoriaId).eq('user_id', userId).eq('ativa', true).order('nome'),
      flux.from('despesas').select('valor, subcategoria_id').eq('user_id', userId).eq('categoria_id', categoriaId).gte('data', inicio).lte('data', fim)
    ]);

    if (!categoria) {
      document.getElementById('categoriaNome').textContent = 'Categoria não encontrada';
      return;
    }
    categoriaAtual = categoria;
    document.getElementById('categoriaNome').textContent = categoria.nome;

    limiteMesAtual = limiteEfetivo(Number(categoria.limite_mensal), excecoes || [], mesAtual);
    const totalGasto = (despesas || []).reduce((s, d) => s + Number(d.valor), 0);
    renderLimite(totalGasto, limiteMesAtual);

    const temExcecao = (excecoes || []).some(e => e.mes === `${mesAtual}-01`);
    document.getElementById('notaLimiteOmissao').textContent = temExcecao
      ? `Valor específico para este mês. Limite por omissão: €${euros(categoria.limite_mensal)}.`
      : `A usar o limite por omissão (€${euros(categoria.limite_mensal)}). Editar aqui só muda este mês em diante.`;

    const gastosPorSub = {};
    (despesas || []).forEach(d => {
      const chave = d.subcategoria_id || '__sem_subcategoria__';
      gastosPorSub[chave] = (gastosPorSub[chave] || 0) + Number(d.valor);
    });

    const subcatList = document.getElementById('subcatList');
    if (!subcategorias || subcategorias.length === 0) {
      subcatList.innerHTML = '<div class="empty-note">Sem subcategorias.</div>';
    } else {
      subcatList.innerHTML = subcategorias.map(sc => `
        <div class="subcat-row">
          <span class="subcat-name" data-id="${sc.id}" data-nome="${sc.nome}">${sc.nome}</span>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="subcat-amount">€${euros(gastosPorSub[sc.id] || 0)}</span>
            <div class="row-actions">
              <button class="icon-btn edit-sub-btn" data-id="${sc.id}" data-nome="${sc.nome}" aria-label="Editar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button class="icon-btn danger archive-sub-btn" data-id="${sc.id}" aria-label="Arquivar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>
              </button>
            </div>
          </div>
        </div>`).join('');
      const semSub = gastosPorSub['__sem_subcategoria__'];
      if (semSub) {
        subcatList.innerHTML += `
          <div class="subcat-row">
            <span class="subcat-name">Sem subcategoria</span>
            <span class="subcat-amount">€${euros(semSub)}</span>
          </div>`;
      }
      ligarAcoesSubcategorias();
    }
  }

  function renderLimite(gasto, limite) {
    const excedeu = gasto > limite;
    document.getElementById('limitAmounts').innerHTML =
      `<span class="${excedeu ? 'over' : ''}">€${euros(gasto)}</span> / €${euros(limite)}`;
  }

  (async () => {
    const userId = await fluxRequireSession();
    if (!userId) return;
    userIdGlobal = userId;
    if (!categoriaId) {
      document.getElementById('categoriaNome').textContent = 'Categoria não encontrada';
      return;
    }
    await carregarTudo();
  })();

  // Editar limite deste mês (cria/atualiza exceção em orcamento_categoria_limites)
  document.getElementById('editBtn').addEventListener('click', () => {
    document.getElementById('novoLimite').value = limiteMesAtual;
    document.getElementById('editForm').classList.add('open');
  });
  document.getElementById('cancelarEdicao').addEventListener('click', () => {
    document.getElementById('editForm').classList.remove('open');
  });
  document.getElementById('guardarLimite').addEventListener('click', async () => {
    const novoValor = parseFloat(document.getElementById('novoLimite').value);
    if (isNaN(novoValor) || novoValor < 0) return;
    const { error } = await flux.from('orcamento_categoria_limites').upsert({
      user_id: userIdGlobal,
      categoria_id: categoriaId,
      mes: `${mesAtual}-01`,
      limite_mensal: novoValor
    }, { onConflict: 'categoria_id,mes' });
    if (error) { alert('Não foi possível guardar: ' + error.message); return; }
    document.getElementById('editForm').classList.remove('open');
    await carregarTudo();
  });

  // Editar nome da categoria
  document.getElementById('editCatBtn').addEventListener('click', () => {
    document.getElementById('editCatNome').value = categoriaAtual ? categoriaAtual.nome : '';
    document.getElementById('editCatRow').classList.toggle('open');
  });
  document.getElementById('guardarCatNome').addEventListener('click', async () => {
    const novoNome = document.getElementById('editCatNome').value.trim();
    if (!novoNome) return;
    const { error } = await flux.from('orcamento_categorias').update({ nome: novoNome }).eq('id', categoriaId);
    if (error) { alert('Não foi possível guardar: ' + error.message); return; }
    document.getElementById('editCatRow').classList.remove('open');
    await carregarTudo();
  });

  // Arquivar categoria
  document.getElementById('archiveCatBtn').addEventListener('click', async () => {
    if (!confirm(`Arquivar a categoria "${categoriaAtual?.nome}"? Deixa de aparecer no orçamento, mas o histórico de despesas mantém-se.`)) return;
    const { error } = await flux.from('orcamento_categorias').update({ ativa: false }).eq('id', categoriaId);
    if (error) { alert('Não foi possível arquivar: ' + error.message); return; }
    window.location.href = `orcamento.html?ano=${anoDoMes}`;
  });

  // Subcategorias — criar
  document.getElementById('toggleAddSubBtn').addEventListener('click', () => {
    document.getElementById('addSubRow').classList.toggle('open');
  });
  document.getElementById('guardarNovaSub').addEventListener('click', async () => {
    const nome = document.getElementById('novaSubNome').value.trim();
    if (!nome) return;
    const { error } = await flux.from('orcamento_subcategorias').insert({
      user_id: userIdGlobal, categoria_id: categoriaId, nome, ativa: true
    });
    if (error) { alert('Não foi possível criar: ' + error.message); return; }
    document.getElementById('novaSubNome').value = '';
    document.getElementById('addSubRow').classList.remove('open');
    await carregarTudo();
  });

  function ligarAcoesSubcategorias() {
    document.querySelectorAll('.edit-sub-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const novoNome = prompt('Novo nome da subcategoria:', btn.dataset.nome);
        if (!novoNome || !novoNome.trim()) return;
        const { error } = await flux.from('orcamento_subcategorias').update({ nome: novoNome.trim() }).eq('id', btn.dataset.id);
        if (error) { alert('Não foi possível guardar: ' + error.message); return; }
        await carregarTudo();
      });
    });
    document.querySelectorAll('.archive-sub-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Arquivar esta subcategoria?')) return;
        const { error } = await flux.from('orcamento_subcategorias').update({ ativa: false }).eq('id', btn.dataset.id);
        if (error) { alert('Não foi possível arquivar: ' + error.message); return; }
        await carregarTudo();
      });
    });
  }
</script>

</body>
</html>
